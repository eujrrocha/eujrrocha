      <text x="24" y="112" fill="#F8FAFC" font-size="58" font-weight="750">06</text>
      <text x="112" y="105" fill="#C3D0DF" font-size="17">projetos públicos</text>
      <rect x="24" y="137" width="294" height="3" rx="2" fill="url(#blue)"/>
    </g>
    <g transform="translate(407 28)">
      <rect width="345" height="164" rx="15" fill="#111C29" stroke="#2A4058"/>
      <text x="24" y="42" fill="#91A4BA" font-size="13" font-weight="700" letter-spacing="1.5">FEATURED PROJECTS</text>
      <text x="24" y="112" fill="#F8FAFC" font-size="58" font-weight="750">02</text>
      <text x="112" y="105" fill="#C3D0DF" font-size="17">cases em destaque</text>
      <rect x="24" y="137" width="294" height="3" rx="2" fill="url(#blue)"/>
