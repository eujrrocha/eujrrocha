    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22D3EE"/><stop offset="1" stop-color="#3B82F6"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="1158" height="218" rx="20" fill="url(#bg)" stroke="#29394D" stroke-width="2"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(28 28)">
      <rect width="345" height="164" rx="15" fill="#111C29" stroke="#2A4058"/>
